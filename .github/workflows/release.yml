name: Test, build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      desktop:
        description: Build desktop installers without publishing a release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test application
        run: node --test tests/*.test.cjs
      - name: Test packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build distributions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/build.py --tag "$RELEASE_TAG"
          else
            python3 scripts/build.py
          fi
      - name: Validate desktop frontend preparation
        run: |
          python3 scripts/build_desktop.py --locale ru --prepare-only --output dist/desktop-check-ru
          python3 scripts/build_desktop.py --locale en --prepare-only --output dist/desktop-check-en
      - uses: actions/upload-artifact@v7
        with:
          name: release-ru
          path: dist/bouquet-*-ru.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-en
          path: dist/bouquet-*-en.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-mobile-ru
          path: dist/bouquet-*-mobile-ru.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-mobile-en
          path: dist/bouquet-*-mobile-en.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: dist/site

  desktop:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.desktop)
    needs: build
    strategy:
      fail-fast: false
      matrix:
        locale: [ru, en]
        target:
          - runner: windows-2022
            name: windows-x64
          - runner: ubuntu-22.04
            name: linux-x64
          - runner: macos-15-intel
            name: macos-x64
          - runner: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2
      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install pinned Pake CLI
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Build local desktop application
        env:
          BOUQUET_LOCALE: ${{ matrix.locale }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 scripts/build_desktop.py --locale "$BOUQUET_LOCALE" --tag "$RELEASE_TAG" --output dist/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.target.name }}-${{ matrix.locale }}
          path: dist/desktop/artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: desktop-diagnostics-${{ matrix.target.name }}-${{ matrix.locale }}
          path: dist/desktop/pake-result.json
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and combine release checksums
        working-directory: dist
        run: |
          for manifest in SHA256SUMS*.txt; do
            sha256sum --check "$manifest"
          done
          sha256sum bouquet-*.zip bouquet-*.html bouquet-*.msi bouquet-*.dmg bouquet-*.deb bouquet-*.AppImage > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/bouquet-* \
            dist/SHA256SUMS.txt \
            --verify-tag --title "Bouquet $RELEASE_TAG" --notes ""

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
