name: Test, build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test application
        run: node --test tests/*.test.cjs
      - name: Test packaging
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build distributions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/build.py --tag "$RELEASE_TAG"
          else
            python3 scripts/build.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-ru
          path: dist/bouquet-*-ru.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-en
          path: dist/bouquet-*-en.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-mobile-ru
          path: dist/bouquet-*-mobile-ru.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-mobile-en
          path: dist/bouquet-*-mobile-en.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: dist/site

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist/bouquet-$release_version-ru.zip" \
            "dist/bouquet-$release_version-en.zip" \
            "dist/bouquet-$release_version-mobile-ru.html" \
            "dist/bouquet-$release_version-mobile-en.html" \
            dist/SHA256SUMS.txt \
            --verify-tag --title "Bouquet $RELEASE_TAG" --notes ""

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
